# MongoDB 7 for local dev. Nothing to seed: there is no roster (any
# well-formed employee ID logs in) and the server creates its indexes on
# first request.
#
# Upgrading a volume written by the old roster build (gameData keyed by
# personId)? Run `docker compose down -v` first: its docs and unique
# personId_1 index make the personCode index build fail, so every request 500s.
#
# Usage:
#   docker compose up -d           # start
#   docker compose down            # stop, keep data
#   docker compose down -v         # stop AND wipe data

services:
  mongo:
    image: mongo:7
    container_name: food-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
