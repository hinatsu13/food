# SQL Server 2019 Express in a Linux container, with the database pinned to
# compat level 110 (SQL Server 2012) so the engine plans and parses the way
# prod will. Init scripts in docker/mssql/init/*.sql run once on first boot.
#
# Usage:
#   docker compose up -d           # start; init runs once
#   docker compose down            # stop, keep data
#   docker compose down -v         # stop AND wipe data (re-runs init next time)

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: food-mssql
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_2012!"
      MSSQL_PID: "Express"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./docker/mssql/init:/init:ro
      - ./docker/mssql/init.sh:/init.sh:ro
    environment:
      MSSQL_SA_PASSWORD: "Local_Dev_2012!"
    entrypoint: ["/bin/bash", "/init.sh"]
    restart: "no"

volumes:
  mssql-data:
